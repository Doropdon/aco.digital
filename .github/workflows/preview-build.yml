name: Preview build check
on:
  push:
    branches:
      - "build/**"
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: aco-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build
